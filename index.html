  <script>
    const slidesData = [{"index": 1, "title": "EXECUTIVE TECHNICAL ASSESSMENT", "image": "slides/Slide1.png", "notes": "EXECUTIVE OPENING REMARKS (TO CTO & VP OF ENGINEERING):\nGood morning / afternoon. Thank you for the opportunity to present my technical vision, hands-on architectural experience, and production case studies for the Ahya multi-cloud platform.\n\nToday's presentation directly answers the 8 technical scenarios of your recruitment evaluation. What you will see is not just textbook definitions, but how I have engineered, secured, and debugged high-scale production systems across four diverse cloud environments:\n1. AWS (me-central-1 UAE): Main calculation engine and marketplace\n2. Azure (uaenorth): Disaster recovery warm standby\n3. Alibaba Cloud (Riyadh, KSA): Saudi sovereign compliance engine\n4. Multinet (Pakistan): On-premise VMware hypervisor with strict sovereign data residency.\n\nThroughout this presentation, I'll walk you through our directory structures, GitOps pipelines, real failure post-mortems, and how we cut $16,000/month recurring while achieving 10-minute DR RTO."}, {"index": 2, "title": "PLATFORM OVERVIEW", "image": "slides/Slide2.png", "notes": "TALKING POINTS FOR CTO & VP ENG:\n\u2022 Ahya's architecture is driven by business compliance, high availability, and geographic data sovereignty.\n\u2022 AWS UAE is our primary production powerhouse hosting AhyaOS calculations and the Tawazun marketplace.\n\u2022 Azure UAE North provides active-warm-standby disaster recovery with sub-3 second data replication lag.\n\u2022 Alibaba Cloud in Riyadh guarantees strict compliance with Saudi Arabian NDMO regulations, keeping local sovereign data within KSA borders.\n\u2022 Multinet Pakistan leverages on-premises virtualization on VMware vCloud Director for sensitive emissions data ingestion that must legally remain in Pakistan.\n\u2022 In total, we manage 8 Kubernetes clusters, 200 microservices, and 200 virtual machines with zero vendor lock-in."}, {"index": 3, "title": "QUESTION 1 \u00b7 TERRAFORM ACROSS FOUR CLOUDS", "image": "slides/Slide3.png", "notes": "TALKING POINTS FOR CTO & VP ENG:\n\u2022 Architectural Philosophy: Separation of Concerns. We do not maintain a single monolithic Terraform state. Instead, we have isolated root modules under environments/ consuming standardized modules under modules/.\n\u2022 State Isolation & Compliance: In AWS, Azure, and Alibaba, state files live in encrypted S3 buckets with DynamoDB locking. Pakistan regulations mandate infra metadata stays in-country, so Multinet's backend uses on-prem MinIO and Consul.\n\u2022 Dynamic Auth via Vault: No engineer or CI runner has static long-lived cloud keys \u2014 everything is federated through Vault using short-lived STS tokens and dynamic vCD sessions."}, {"index": 4, "title": "QUESTION 1 \u00b7 PRODUCTION WAR STORY", "image": "slides/Slide4.png", "notes": "TALKING POINTS FOR CTO & VP ENG:\n\u2022 A key sign of a senior platform engineer is learning from architectural anti-patterns.\n\u2022 In early development, cross-cloud networking was attempted using multiple provider blocks in a single root module.\n\u2022 In staging, vCD's 30-minute API token expired mid-apply. Because Terraform runs sequentially through dependencies, the failure in Multinet killed the entire run, leaving AWS ALBs orphaned and DynamoDB locked.\n\u2022 Rather than just patching the timeout to 120 minutes, I spearheaded the architectural refactoring to decouple the environments completely.\n\u2022 By enforcing terraform_remote_state and independent CI pipelines, failure domains are strictly isolated: no single cloud provider's API issues can ever block deployment to our other three clouds."}, {"index": 5, "title": "QUESTION 2 \u00b7 KUBERNETES FLEET OPERATIONS", "image": "slides/Slide5.png", "notes": "TALKING POINTS FOR CTO & VP ENG:\n\u2022 Managing 4 Kubernetes distributions across 4 clouds with different minor versions (1.27.8 to 1.28.4) requires strict GitOps governance.\n\u2022 We use Argo CD v2.9.3 with ApplicationSets and the Cluster Matrix Generator. Developers maintain a single Helm chart for the AhyaOS engine.\n\u2022 Argo CD detects cluster labels (e.g. cloud: aws, compliance: ndmo) and automatically injects the cloud-specific values-{{cloud}}.yaml file.\n\u2022 This abstracts infrastructure differences completely: developers don't care whether storage is gp3 on AWS, managed-csi on Azure, or Ceph on Multinet\u2014it is bound cleanly at deployment time."}, {"index": 6, "title": "QUESTION 2 \u00b7 PRODUCTION WAR STORY", "image": "slides/Slide6.png", "notes": "TALKING POINTS FOR CTO & VP ENG:\n\u2022 When managing self-hosted Kubernetes on bare-metal or VMware (like Multinet), you must possess deep kernel and CNI debugging skills.\n\u2022 In cloud-managed EKS and AKS, Karpenter and node surging handle AMI recycling cleanly. But in Multinet, we built an automated Ansible cordon/drain/upgrade/uncordon pipeline.\n\u2022 During the 1.26 to 1.27 upgrade, Cilium CNI crashed with \"cannot allocate memory\" creating BPF maps. We diagnosed that Ubuntu 20.04 Kernel 5.4 has conservative default BPF JIT limits that suffocated when pod density surpassed 60 pods/node.\n\u2022 We executed dynamic sysctl fixes in 14 minutes, then codified the kernel settings directly into our Packer golden image build pipeline so it can never recur."}, {"index": 7, "title": "QUESTION 3 \u00b7 PATCH MANAGEMENT & DEVSECOPS", "image": "slides/Slide7.png", "notes": "TALKING POINTS FOR CTO & VP ENG:\n\u2022 Enterprise fleet management requires balancing security urgency against production uptime.\n\u2022 We operate a ring-based patching model: Ring 0 (Dev 10%), Ring 1 (Staging 100%), Ring 2 (Prod in 20% canary batches with max_fail_percentage: 0).\n\u2022 For our 50 Windows ERP connector servers, we enforce WinRM over HTTPS on port 5986 with Vault-managed TLS certs and extended reboot timeouts (1200s).\n\u2022 For Kubernetes and containers, we practice immutable infrastructure: nodes are recycled via bi-weekly CIS-hardened Packer golden images, and containers are scanned using Trivy with hard exit gates on High/Critical vulnerabilities using Chainguard and Distroless base images."}, {"index": 8, "title": "QUESTION 3 \u00b7 PRODUCTION WAR STORY", "image": "slides/Slide8.png", "notes": "TALKING POINTS FOR CTO & VP ENG:\n\u2022 Real security engineering is tested when an unannounced critical zero-day drops with a tight SLA.\n\u2022 When glibc \"Looney Tunables\" hit, our SLA was strict: 4 hours. Linux patched in 90 minutes, but the playbook failed on 6 Windows ERP connectors with error 0x80070422.\n\u2022 Rather than finger-pointing at the finance audit team who had disabled wuauserv to avoid month-end reboot collisions, I quickly engineered an idempotent Ansible pre-task that enabled wuauserv, purged download locks, installed updates, and cleanly closed the loop.\n\u2022 We completed 100% remediation across 200 servers in 3 hours and 12 minutes without downtime."}, {"index": 9, "title": "QUESTION 4 \u00b7 WAF & SECURITY HARDENING", "image": "slides/Slide9.png", "notes": "TALKING POINTS FOR CTO & VP ENG:\n\u2022 Security posture must be uniform even when underlying cloud providers differ.\n\u2022 In AWS, we utilize AWS WAFv2 with CloudFront and ALB. In Azure, Front Door Premium with Microsoft Threat Intelligence.\n\u2022 In Alibaba Riyadh, we deploy Cloud Native WAF 3.0. In Multinet Pakistan, where native hyperscaler WAF doesn't exist, we architected OpenResty Nginx v1.25 with Coraza WAF v3.0 executing OWASP Core Rule Set v4.0.\n\u2022 Across all platforms, auth endpoints (/api/v1/auth/) are rate-limited to 300 requests per 5 minutes per IP.\n\u2022 Internally, Zero-Trust is enforced via TLS 1.3 externally, Cilium Service Mesh mTLS internally, and HashiCorp Vault rotating PostgreSQL credentials dynamically every 24 hours."}, {"index": 10, "title": "QUESTION 4 \u00b7 PRODUCTION WAR STORY", "image": "slides/Slide10.png", "notes": "TALKING POINTS FOR CTO & VP ENG:\n\u2022 False positives during high-stakes compliance audits are moments of maximum friction between security and business.\n\u2022 At 11:30 PM, KPMG auditors uploading Scope 3 carbon data were blocked by HTTP 403s. The JSON contained legitimate text resembling a SQL statement, tripping OWASP CRS Rule 942100 (SQLi_BODY).\n\u2022 A weak engineer might panic and disable SQLi protection globally. I refused to compromise our security posture.\n\u2022 Instead, I applied a surgical Terraform override that excluded SQLi_BODY exclusively on that specific endpoint, while routing the upload into an asynchronous worker queue that sanitized the JSON via parameterized queries.\n\u2022 From PagerDuty page to production fix was 11 minutes flat."}, {"index": 11, "title": "QUESTION 5 \u00b7 FINOPS & COST OPTIMIZATION", "image": "slides/Slide11.png", "notes": "TALKING POINTS FOR CTO & VP ENG:\n\u2022 As engineering leaders, we must deliver financial accountability alongside technical excellence.\n\u2022 Baseline monthly spend was $80,000 ($50K AWS, $15K Azure, $8K Multinet, $7K Alibaba). Through Infracost in GitHub Actions, Kubecost on EKS/AKS, and AWS CUR Athena queries, we identified and eliminated 4 waste buckets:\n1. AWS Compute ($6,800/mo): kube-downscaler for dev/staging off-hours ($3,200/mo) + Karpenter Spot for ML batch jobs ($3,600/mo).\n2. Storage ($3,500/mo): GP2\u2192GP3 migration ($1,100/mo) + S3 Glacier Instant Retrieval lifecycle rules ($2,400/mo).\n3. Azure DR ($2,800/mo): downsized idle warm standby from 10 to 2 nodes, letting KEDA scale on actual disaster.\n4. Network & Commitments ($2,900/mo): Multinet 1G\u2192200M burstable ($1,700/mo) + Alibaba Savings Plan ($1,200/mo).\n\u2022 Net result: $16,000/month recurring savings ($192K/year) with zero impact on RTO, RPO, or SOC 2."}, {"index": 12, "title": "QUESTION 6 \u00b7 INCIDENT RESPONSE & RCA", "image": "slides/Slide12.png", "notes": "TALKING POINTS FOR CTO & VP ENG:\n\u2022 Great incident management is defined by three things: rapid containment, blameless deep-dive RCA, and permanent architectural prevention.\n\u2022 At 03:08 GST, our P99 latency breached 15s and 5xx errors crossed 45%. By 03:14 I took command as Incident Commander, diagnosed the 500-connection ceiling on Aurora, and saw 340 connections held hostage by long-running aggregation queries.\n\u2022 At 03:29 I scaled the rogue Celery audit deployment to 0 replicas. Full recovery occurred at 03:32 (MTTR: 24 minutes).\n\u2022 In our 5-Whys RCA, we traced the systemic flaws: PgBouncer in session mode, Celery routed to primary instead of read replica, and a missing index on 38M rows.\n\u2022 We enacted 5 permanent fixes: PgBouncer transaction mode, concurrent indexing, statement_timeout=30s, K8s NetworkPolicies, and CI query plan linting with pg_query."}, {"index": 13, "title": "QUESTION 7 \u00b7 INFRASTRUCTURE-AS-CODE STRATEGY", "image": "slides/Slide13.png", "notes": "TALKING POINTS FOR CTO & VP ENG:\n\u2022 ClickOps is the enemy of SOC 2 compliance and platform reliability. 40% manual AWS footprint had to be eliminated.\n\u2022 Rather than a chaotic lift-and-shift, I designed a phased risk-tiered rollout: Phase 1 Networking, Phase 2 Persistence (with prevent_destroy = true), Phase 3 Compute & Traffic.\n\u2022 We utilized Terraform 1.5+ declarative import blocks and -generate-config-out, scrubbing machine-generated HCL into clean modular templates with mandatory IFRS-S2 tagging.\n\u2022 In Multinet Pakistan, where VMware vCD lacked API parity, we built a Python adapter script with Redis token caching.\n\u2022 To ensure drift never sneaks back in, a daily 06:00 GST GitHub Actions workflow runs terraform plan -detailed-exitcode. If any engineer touches the AWS console, exit code 2 immediately files a Jira P2 ticket and pings Slack."}, {"index": 14, "title": "QUESTION 8 \u00b7 MULTI-CLOUD DISASTER RECOVERY", "image": "slides/Slide14.png", "notes": "TALKING POINTS FOR CTO & VP ENG:\n\u2022 For enterprise ESG and carbon accounting, contractual SLAs are non-negotiable: RTO <= 15 minutes, RPO <= 5 minutes.\n\u2022 Architecture: AWS UAE is 100% active, Azure UAE North is warm standby. Multinet PK and Alibaba KSA run active-active for local compliance.\n\u2022 Data Replication: We achieve a median database RPO of 2.2 seconds using pglogical v2.4 over an IPsec tunnel. S3 documents sync to Azure Blob via Lambda in 42 seconds. Identity tokens validate seamlessly via Vault-replicated public keys.\n\u2022 Failover Execution: Driven by Cloudflare synthetic probes and GitHub Actions. Database promotion takes 2 minutes, KEDA AKS scale-up takes 3 minutes, and Cloudflare DNS cutover takes 2 minutes.\n\u2022 Measured drill RTO: 10 minutes and 15 seconds\u2014beating our SLA by almost 5 minutes."}, {"index": 15, "title": "QUESTION 8 \u00b7 PRODUCTION WAR STORY", "image": "slides/Slide15.png", "notes": "TALKING POINTS FOR CTO & VP ENG:\n\u2022 Real leadership is demonstrating how you handle failure when an architecture breaks under testing.\n\u2022 During a quarterly DR simulation, 60 seconds after cutover, Azure AKS error rates spiked to 100%. Pods threw \"role ahya_calc_worker does not exist\".\n\u2022 We uncovered a critical technical reality: PostgreSQL pglogical replicates table rows, but it does NOT replicate cluster roles or users. An engineer had created that user manually on AWS two weeks earlier.\n\u2022 Furthermore, client bank ERPs had stubborn DNS resolvers that cached the dead AWS IP despite our 30-second TTL.\n\u2022 We recovered in 8 minutes with an emergency Ansible script. Then we engineered permanent systemic safeguards: daily SchemaCrawler DDL drift checks in CI, and Cloudflare HTTP 307 temporary redirect rules to bypass broken client DNS resolvers."}, {"index": 16, "title": "LEADERSHIP & STRATEGIC IMPACT", "image": "slides/Slide16.png", "notes": "TALKING POINTS FOR CTO & VP ENG:\n\u2022 As your platform lead, my goal is to free product engineering to build features fast while guaranteeing the foundation is unshakeable, secure, and cost-efficient.\n\u2022 My leadership philosophy centers on 4 pillars: Reliability (error budgets & MTTR < 30m), DevSecOps (SOC 2, 4h zero-day SLAs), FinOps ($192K/year recurring savings), and Velocity (self-service GitOps).\n\u2022 In my first 30 days: deep discovery, drift auditing, and establishing single-pane-of-glass FinOps and telemetry.\n\u2022 Days 31-60: standardizing all Kubernetes clusters under ArgoCD ApplicationSets, eradicating all ClickOps via Terraform, and enforcing Trivy CI security gates.\n\u2022 Days 61-90: institutionalizing quarterly chaos engineering DR drills and delivering the full 20% recurring infrastructure cost reduction back to the business."}, {"index": 17, "title": "THANK YOU \u2014 OPEN FOR TECHNICAL Q&A", "image": "slides/Slide17.png", "notes": "CLOSING REMARKS FOR CTO & VP ENG:\n\u2022 Thank you very much for your time and consideration.\n\u2022 To summarize: I don't just write scripts\u2014I build reliable, secure, and cost-efficient platforms that empower product teams to ship with confidence.\n\u2022 I have lived through real production fires\u2014from midnight WAF blocks during audit deadlines, to 3 AM database connection saturations, to zero-day CVE turnaround\u2014and in every instance, I have engineered permanent systemic solutions.\n\u2022 I look forward to answering any questions you have on multi-cloud topology, Kubernetes operations, database replication, or how I would lead your platform team."}];
    let currentIdx = 0;

    const slideImg = document.getElementById('current-slide-img');
    const slideNum = document.getElementById('slide-num');
    const slideTitlePreview = document.getElementById('slide-title-preview');
    const notesDrawer = document.getElementById('notes-drawer');
    const notesContent = document.getElementById('notes-content');
    const gridDrawer = document.getElementById('grid-drawer');

    slidesData.forEach((s, idx) => {
      const thumb = document.createElement('div');
      thumb.className = 'grid-thumb' + (idx === 0 ? ' active' : '');
      thumb.onclick = () => { goToSlide(idx); toggleGrid(); };
      thumb.innerHTML = `<img src="${s.image}" loading="lazy"><span class="grid-thumb-num">${String(idx+1).padStart(2,'0')}</span>`;
      gridDrawer.appendChild(thumb);
    });

    slidesData.forEach(s => {
      const img = new Image();
      img.src = s.image;
    });

    function updateView() {
      const s = slidesData[currentIdx];
      slideImg.src = s.image;
      slideImg.alt = s.title;
      slideNum.textContent = `${String(currentIdx + 1).padStart(2, '0')} / ${String(slidesData.length).padStart(2, '0')}`;
      slideTitlePreview.textContent = s.title;
      notesContent.textContent = s.notes || 'No speaker notes available for this slide.';

      document.querySelectorAll('.grid-thumb').forEach((el, idx) => {
        el.classList.toggle('active', idx === currentIdx);
      });
    }

    function nextSlide() {
      if (currentIdx < slidesData.length - 1) {
        currentIdx++;
        updateView();
      }
    }

    function prevSlide() {
      if (currentIdx > 0) {
        currentIdx--;
        updateView();
      }
    }

    function goToSlide(idx) {
      if (idx >= 0 && idx < slidesData.length) {
        currentIdx = idx;
        updateView();
      }
    }

    function toggleNotes() { notesDrawer.classList.toggle('open'); }
    function toggleGrid() { gridDrawer.classList.toggle('open'); }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') nextSlide();
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
      else if (e.key.toLowerCase() === 's') toggleNotes();
      else if (e.key.toLowerCase() === 'g') toggleGrid();
      else if (e.key.toLowerCase() === 'f') toggleFullscreen();
      else if (e.key === 'Escape') {
        if (notesDrawer.classList.contains('open')) toggleNotes();
        if (gridDrawer.classList.contains('open')) toggleGrid();
      }
    });

    updateView();
  </script>
